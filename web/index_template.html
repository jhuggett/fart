<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>fastart</title>
	<style>
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #121213; }
		canvas.ed_canvas {
			display: block;
			/* !important beats any inline style emscripten writes: the
			   backing store runs at devicePixelRatio, the element stays
			   viewport-sized, and that gap is what makes retina sharp */
			width: 100vw !important; height: 100vh !important;
			touch-action: none; -webkit-user-select: none; user-select: none;
		}
	</style>
	<script src="odin.js"></script>
</head>
<body>
	<canvas class="ed_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"
		onmousedown="event.target.focus()"></canvas>
	<script>
		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		// The .fart files, mirrored from the serving machine. Reads come
		// from here; writes update it and stream back over the wire.
		var files = {};
		var filePaths = [];
		var wex = null; // wasm exports (memory access)

		function heap() { return new Uint8Array(wex.memory.buffer); }
		function readStr(ptr, len) {
			return new TextDecoder().decode(heap().subarray(ptr, ptr + len));
		}

		var fartEnv = {
			jf_count: () => filePaths.length,
			jf_path: (i, buf, cap) => {
				var bytes = new TextEncoder().encode(filePaths[i] || "");
				var n = Math.min(bytes.length, cap);
				heap().set(bytes.subarray(0, n), buf);
				return n;
			},
			jf_size: (p, n) => {
				var f = files[readStr(p, n)];
				return f === undefined ? -1 : f.length;
			},
			jf_read: (p, n, out) => {
				var f = files[readStr(p, n)];
				if (f !== undefined) heap().set(f, out);
			},
			jf_write: (p, n, d, dn) => {
				var path = readStr(p, n);
				var data = heap().slice(d, d + dn);
				files[path] = data;
				if (!filePaths.includes(path)) filePaths.push(path);
				fetch("api/file?path=" + encodeURIComponent(path), {
					method: "PUT", body: data,
				}).catch(() => {});
			},
		};

		var Module = {
			instantiateWasm: (imports, successCallback) => {
				const newImports = { ...odinImports, ...imports, fart_env: fartEnv };
				return WebAssembly.instantiateStreaming(fetch("index.wasm"), newImports).then(function (output) {
					var e = output.instance.exports;
					wex = e;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					return successCallback(output.instance);
				});
			},
			onRuntimeInitialized: async () => {
				var e = wasmExports;
				try {
					var list = await (await fetch("api/list")).json();
					await Promise.all(list.map(async (p) => {
						var r = await fetch("api/file?path=" + encodeURIComponent(p));
						if (r.ok) {
							files[p] = new Uint8Array(await r.arrayBuffer());
							filePaths.push(p);
						}
					}));
					filePaths.sort();
				} catch (err) { console.log("file sync failed:", err); }

				e._start();
				e.main_start();

				function send_resize() {
					e.web_window_size_changed(window.innerWidth, window.innerHeight,
						window.devicePixelRatio || 1);
				}
				window.addEventListener("resize", send_resize, true);
				send_resize();

				function do_main_update() {
					if (!e.main_update()) { e.main_end(); e._end(); return; }
					window.requestAnimationFrame(do_main_update);
				}
				window.requestAnimationFrame(do_main_update);
			},
			print: (text) => console.log(text),
			canvas: (function () { return document.getElementById("canvas"); })(),
		};
	</script>

	<!-- Emscripten injects its javascript here -->
	{{{ SCRIPT }}}
</body>
</html>
